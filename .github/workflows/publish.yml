# Publishes signed PDFs as a dated release, after verifying every one (macula-codex).
#
# This exists so anyone can download Macula's public PDFs and check that our CI made them.
#
# Each delivery branch is written by one source repository's CI with a deploy key, and is
# verified against exactly one workflow identity (scripts/verify_delivery.sh):
#   readme-pdf    macula-ecosystem   .github/workflows/readme-pdf.yml@refs/heads/main
#   register-pdf  macula-architecture .github/workflows/security-register-export.yml@refs/heads/main
# Nothing is published unless every delivered file verifies. Readers verify again
# themselves (README.md): that, not this workflow, is what they should trust.
name: publish

on:
  push:
    branches: [readme-pdf, register-pdf]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify every delivered file against the branch's identity
        run: scripts/verify_delivery.sh "$GITHUB_REF_NAME" origin/main > "$RUNNER_TEMP/files.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery
          path: ${{ runner.temp }}/files.txt
      - id: tag
        run: echo "tag=$(date -u +%Y-%m-%d)-${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: delivery
          path: ${{ runner.temp }}
      - name: Publish the verified files as a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists"; exit 0; fi
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          id="$(scripts/identity.sh "$GITHUB_REF_NAME")"
          notes="Signed by the CI workflow $id, verified before publishing. The release date is the publish date.

          To check a file yourself (cosign 3):

              cosign verify-blob --bundle FILE.sigstore.json \\
                --certificate-identity $id \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                FILE

          Delivered by commit $GITHUB_SHA on branch $GITHUB_REF_NAME."
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" "${files[@]}"
